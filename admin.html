<style>
  /* Admin-only styles */
  .admin-head { padding: clamp(2rem, 5vw, 3rem) 0 .5rem; display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end; justify-content: space-between; }
  .admin-head h1 { font-size: clamp(2rem, 6vw, 3.2rem); margin-bottom: .15em; }
  .admin-head p { margin: 0; color: var(--muted); }
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 900px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
  .stat-card { padding: 1rem 1.1rem; }
  .stat-card .stat { font-size: 1.4rem; display: block; margin-bottom: .3rem; }
  .stat-card .lbl { color: var(--muted); font-size: .9rem; }
  .stat-card .sub { color: var(--dim); font-size: .82rem; margin-top: .2rem; }
  .queue-item { display: grid; gap: .6rem; padding: 1.1rem 1.2rem; border-left: 3px solid var(--pink); }
  .queue-item.is-pending { border-left-color: var(--cyan); }
  .queue-item .excerpt { background: rgba(13,19,40,.6); border: 1px solid var(--line); border-radius: var(--r-sm); padding: .7rem .9rem; color: var(--muted); font-size: .95rem; overflow-wrap: anywhere; }
  .queue-item .meta { color: var(--dim); font-size: .88rem; }
  .queue-item .acts { display: flex; flex-wrap: wrap; gap: 6px; }
  .acts .btn-sm { min-height: 44px; padding: .45rem .8rem; font-size: .85rem; }
  .btn-warn { background: #3a2a10; color: #ffe2a8; --edge: #1d1406; }
  .table td .acts { margin-top: .3rem; }
  .table .uname { font-weight: 700; overflow-wrap: anywhere; }
  .table .badge { font-size: .5rem; }
  @media (max-width: 700px) {
    .users-table thead { display: none; }
    .users-table tr { display: grid; gap: .35rem; padding: .9rem .5rem; border-bottom: 1px solid var(--line); }
    .users-table td { display: block; border: 0; padding: 0; }
    .users-table td[data-label]::before { content: attr(data-label) ': '; color: var(--dim); font-size: .85rem; }
  }
  .status-ok { color: var(--ok); } .status-muted { color: var(--warn); } .status-banned { color: var(--danger); }
  .sel { min-height: 44px; background: var(--bg); color: var(--text); border: 2px solid var(--line-strong); border-radius: var(--r-sm); padding: .4rem 2.2rem .4rem .8rem; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 12px) 50%; background-size: 6px 6px; background-repeat: no-repeat; max-width: 100%; }
  .toggle { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .9rem 0; border-bottom: 1px solid var(--line); }
  .toggle:last-of-type { border-bottom: 0; }
  .toggle label { font-weight: 600; cursor: pointer; }
  .toggle .hint { display: block; font-weight: 400; color: var(--dim); font-size: .88rem; }
  .switch { position: relative; width: 52px; height: 30px; flex: none; }
  .switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .switch span { pointer-events: none; position: absolute; inset: 0; background: var(--bg); border: 2px solid var(--line-strong); border-radius: 999px; }
  .switch span::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: var(--muted); border-radius: 50%; transition: transform .15s, background .15s; }
  .switch input:checked + span { background: rgba(255,210,63,.2); border-color: var(--yellow); }
  .switch input:checked + span::after { transform: translateX(22px); background: var(--yellow); }
  .switch input:focus-visible + span { outline: 3px solid var(--yellow); outline-offset: 3px; }
  .cms-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; align-items: start; }
  @media (max-width: 900px) { .cms-layout { grid-template-columns: 1fr; } }
  .cms-list { display: grid; gap: 8px; }
  .cms-row { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; justify-content: space-between; padding: .8rem 1rem; }
  .cms-row .t { font-weight: 600; overflow-wrap: anywhere; }
  .cms-row .m { color: var(--dim); font-size: .85rem; }
  .preview { min-height: 120px; }
  .preview .body p { max-width: none; }
  .preview .body a { word-break: break-all; }
  .export-box { width: 100%; min-height: 260px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .8rem; background: var(--bg); color: var(--text); border: 2px solid var(--line-strong); border-radius: var(--r-sm); padding: .75rem; }
  .list-gap { display: grid; gap: 10px; }
  .locked-panel { max-width: 560px; margin: 2rem auto; text-align: center; padding: 2.5rem 1.5rem; }
  .wrap-any { overflow-wrap: anywhere; }
  .req-admin { display: grid; grid-template-columns: 1fr auto; gap: 1rem; align-items: center; padding: .9rem 1.1rem; }
  @media (max-width: 560px) { .req-admin { grid-template-columns: 1fr; } }
  .req-admin h3 { margin: 0 0 .1em; font-size: 1.15rem; overflow-wrap: anywhere; }
  .req-admin .m { color: var(--dim); font-size: .85rem; }
  #tabs { margin-top: 1rem; }
</style>
