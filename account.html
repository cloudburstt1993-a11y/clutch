<style>
  /* Account-only styles */
  .auth-wrap { max-width: 560px; margin: 0 auto; }
  .auth-wrap .panel { padding: 1.75rem; }
  .auth-tabs { margin: 0 0 1.25rem; }
  .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 380px) { .avatar-grid { grid-template-columns: repeat(2, 1fr); } }
  .avatar-tile { position: relative; display: grid; place-items: center; padding: 12px; background: var(--bg); border: 2px solid var(--line-strong); border-radius: var(--r-sm); cursor: pointer; min-height: 72px; }
  .avatar-tile:hover { border-color: var(--cyan); }
  .avatar-tile .avatar { width: 48px; height: 48px; }
  .avatar-tile:has(input:checked) { border-color: var(--yellow); box-shadow: 0 0 0 1px var(--yellow), 0 0 14px rgba(255,210,63,.35); }
  .avatar-tile:focus-within { outline: 3px solid var(--yellow); outline-offset: 3px; }
  .age-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media (max-width: 420px) { .age-row { grid-template-columns: 1fr; } }
  .me-card { display: grid; grid-template-columns: 96px 1fr; gap: 1.25rem; align-items: center; }
  .me-card .avatar-lg { width: 96px; height: 96px; }
  .me-card h1 { margin: 0 0 .2em; font-size: clamp(2rem, 6vw, 3rem); overflow-wrap: anywhere; }
  @media (max-width: 480px) { .me-card { grid-template-columns: 1fr; } }
  .lic { display: grid; gap: .5rem; }
  .lic .key { font-family: var(--pixel); font-size: .8rem; color: var(--yellow); word-break: break-all; line-height: 1.6; }
  .lic .row-k { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .toggle { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .9rem 0; border-bottom: 1px solid var(--line); }
  .toggle:last-of-type { border-bottom: 0; }
  .toggle label { font-weight: 600; cursor: pointer; }
  .toggle .hint { display: block; font-weight: 400; color: var(--dim); font-size: .88rem; }
  .switch { position: relative; width: 52px; height: 30px; flex: none; }
  .switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .switch span { pointer-events: none; position: absolute; inset: 0; background: var(--bg); border: 2px solid var(--line-strong); border-radius: 999px; transition: background .15s, border-color .15s; }
  .switch span::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: var(--muted); border-radius: 50%; transition: transform .15s, background .15s; }
  .switch input:checked + span { background: rgba(255,210,63,.2); border-color: var(--yellow); }
  .switch input:checked + span::after { transform: translateX(22px); background: var(--yellow); }
  .switch input:focus-visible + span { outline: 3px solid var(--yellow); outline-offset: 3px; }
  .danger-zone { border-color: rgba(255,107,107,.4); }
  .proto-line { margin-top: 2.5rem; padding-top: 1.25rem; border-top: 1px dashed var(--line-strong); color: var(--dim); font-size: .9rem; display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; }
  .side-nav button { display: block; width: 100%; text-align: left; padding: 11px 12px; border-radius: var(--r-sm); color: var(--muted); font-weight: 500; background: transparent; border: 0; cursor: pointer; min-height: 44px; }
  .side-nav button:hover, .side-nav button[aria-current="page"] { background: rgba(255,255,255,.06); color: var(--text); box-shadow: inset 3px 0 0 var(--pink); }
  @media (max-width: 860px) { .side-nav { position: static; display: flex; flex-wrap: wrap; gap: 6px; } .side-nav button { width: auto; border: 1px solid var(--line-strong); border-radius: 999px; padding: 8px 14px; } .side-nav button[aria-current="page"] { box-shadow: none; background: var(--yellow); color: #1a1205; border-color: var(--yellow); } }
  .wrap-any { overflow-wrap: anywhere; }
</style>
