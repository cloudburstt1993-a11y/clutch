<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clutch</title>
<link rel="icon" href="/favicon.ico">
<style>
:root{
  --bg:#121a33; --panel:#1a2447; --raise:#22305a; --well:#0d1328; --line:#2e3e70; --line-soft:#243260;
  --text:#f1f4ff; --muted:#9aa6cc; --faint:#66739c;
  --live:#ffd23f; --live-ink:#2b2100;          /* pressed right now */
  --mod:#3ec6ff; --mod-ink:#032433;            /* your mods / output / "on" */
  --brand:#ff5fa2; --brand-ink:#3a0019;        /* primary actions */
  --violet:#7c5cff; --warn:#ff6b6b; --warn-bg:#3a1a2a;
  --accent:#3ec6ff;                            /* per-profile color, set from JS */
  --r-xl:22px; --r-lg:16px; --r:12px; --r-sm:8px;
  --font: Bahnschrift, "DIN Alternate", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --font-cond: "Bahnschrift SemiCondensed", "Bahnschrift Condensed", Bahnschrift, "Arial Narrow", sans-serif;
  --emoji: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15.5px/1.45 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mod);outline-offset:2px}
[hidden]{display:none !important}
.muted{color:var(--muted)}
.help{color:var(--muted);font-size:13.5px;line-height:1.4}
.emo{font-family:var(--emoji);font-style:normal}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:var(--raise);border-radius:8px;border:3px solid var(--bg)}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:10px 18px;background:rgba(13,19,40,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-soft)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-cond);font-weight:700;font-size:24px;letter-spacing:.01em}
.logo img{width:34px;height:34px}
.pill{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--panel);font-size:14px;white-space:nowrap;max-width:420px;overflow:hidden}
.pill span:last-child{overflow:hidden;text-overflow:ellipsis}
.pill .dot{width:10px;height:10px;border-radius:50%;background:var(--faint);flex:none}
.pill.ok .dot{background:#3ee6a0;box-shadow:0 0 0 4px rgba(62,230,160,.18)}
.pill.wait .dot{background:var(--live)}
.pill.off .dot{background:var(--warn)}
.playing{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.spacer{flex:1}
.save-state{font-size:13px;color:var(--muted)}
.save-state.dirty{color:var(--live)}
.save-state.err{color:var(--warn)}

/* the big on/off switch */
.power{display:flex;align-items:center;gap:12px;border:0;border-radius:999px;padding:6px 18px 6px 6px;cursor:pointer;font-weight:700;font-size:16px;background:var(--raise);color:var(--muted);transition:background .2s,color .2s,box-shadow .2s}
.power .knob{width:34px;height:34px;border-radius:50%;background:var(--faint);display:grid;place-items:center;transition:background .2s,transform .2s}
.power .knob svg{width:18px;height:18px}
.power.on{background:linear-gradient(90deg,#1c6f93,#2a9fcf);color:#fff;box-shadow:0 0 0 3px rgba(62,198,255,.25),0 6px 22px rgba(62,198,255,.25)}
.power.on .knob{background:#fff;color:#1c6f93}
.power:not(.on) .knob{color:var(--bg)}

/* ---------- generic controls ---------- */
button{cursor:pointer;border:1px solid var(--line);background:var(--raise);border-radius:var(--r-sm);padding:8px 14px}
button:hover{border-color:var(--muted)}
button.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
button.primary:hover{filter:brightness(1.07)}
button.primary:disabled{background:var(--raise);color:var(--faint);border-color:var(--line);cursor:default;filter:none}
button.ghost{background:transparent}
button.danger{background:transparent;border-color:#7a3446;color:var(--warn)}
button.small{padding:5px 11px;font-size:13.5px}
button.icon{padding:3px 8px;line-height:1.2;background:transparent;border-color:transparent;color:var(--muted)}
button.icon:hover{color:var(--text);border-color:var(--line)}
select,input[type=text],input[type=number],textarea{background:var(--well);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;min-width:0}
select{padding-right:6px}
input[type=number]{width:84px}
select:hover,input[type=text]:hover,input[type=number]:hover{border-color:var(--muted)}
input[type=range]{accent-color:var(--mod);width:100%;height:22px}
input[type=color]{width:44px;height:34px;padding:2px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--well)}
.linkbtn{background:none;border:0;padding:0;color:var(--mod);font-size:13.5px;align-self:flex-start}
.linkbtn:hover{text-decoration:underline}
.cellrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.unit{color:var(--muted);font-size:13px}

/* toggle switch */
.sw{position:relative;flex:none;width:54px;height:32px;border-radius:999px;border:0;padding:0;background:var(--line);transition:background .18s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .18s cubic-bezier(.3,1.4,.6,1)}
.sw[aria-checked=true]{background:var(--mod)}
.sw[aria-checked=true]::after{transform:translateX(22px)}
.sw:disabled{opacity:.45;cursor:default}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 59px)}
.side{border-right:1px solid var(--line-soft);padding:16px 12px;display:flex;flex-direction:column;gap:3px}
.side h2{font-size:13px;font-weight:600;color:var(--muted);margin:14px 10px 6px}
.side ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.nav{width:100%;text-align:left;display:flex;align-items:center;gap:10px;background:transparent;border:1px solid transparent;border-radius:var(--r);padding:9px 11px;font-size:15.5px}
.nav:hover{background:var(--panel);border-color:transparent}
.nav.sel{background:var(--raise);border-color:var(--line)}
.nav .emo{font-size:19px;width:24px;text-align:center}
.nav .pname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .live-dot{width:9px;height:9px;border-radius:50%;background:var(--live);box-shadow:0 0 0 3px rgba(255,210,63,.2)}
.nav .badge{font-size:12px;background:var(--warn);color:#2a0b07;border-radius:999px;padding:0 7px;font-weight:700}
.nav .bar{width:4px;height:20px;border-radius:2px;background:var(--pc,var(--mod));opacity:.9}
.side .add{margin:6px 10px 0;align-self:flex-start}
.side .grow{flex:1}

main{padding:26px 32px 80px;max-width:1280px;width:100%}
.ph{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.ph h1{font-family:var(--font-cond);font-weight:700;font-size:46px;line-height:1;margin:0;letter-spacing:.01em}
.ph .bigemo{font-size:42px;line-height:1}
.ph .sub{color:var(--muted);padding-bottom:4px}
.ph .acts{margin-left:auto;display:flex;gap:8px;padding-bottom:2px;flex-wrap:wrap}
.lede{color:var(--muted);max-width:720px;margin:4px 0 22px;font-size:16px}
.banner{border:1px solid #7a3446;background:var(--warn-bg);color:#ffd6dd;border-radius:var(--r);padding:12px 16px;margin:12px 0;font-size:14.5px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btnstack{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.banner.info{border-color:var(--line);background:var(--panel);color:var(--text)}
.section-title{font-size:21px;font-weight:700;margin:34px 0 6px}
.section-sub{color:var(--muted);margin:0 0 14px;font-size:14.5px}

/* ---------- controller diagram ---------- */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:24px;align-items:center;margin:6px 0 16px}
#pad{width:100%;max-width:700px;height:auto;display:block}
#pad .hit{cursor:pointer}
#pad .face{fill:#2c3b6b;stroke:#4a5c96;stroke-width:1.5;transition:fill .06s}
#pad .hit:hover .face{stroke:var(--text)}
#pad .lbl{fill:#c3cbea;font:700 13px var(--font);pointer-events:none;text-anchor:middle;dominant-baseline:central}
#pad .on .face{fill:var(--live)}
#pad .on .lbl{fill:var(--live-ink)}
#pad .ring{fill:none;stroke:var(--mod);stroke-width:3;opacity:0;pointer-events:none}
#pad .modded .ring{opacity:1}
#pad .sel .face{stroke:#fff;stroke-width:3}
#pad .trigfill{fill:var(--live);pointer-events:none}
#pad .well{fill:var(--well);stroke:var(--line);stroke-width:1.5}
.legend{display:flex;flex-direction:column;gap:12px;font-size:14px}
.legend .k{display:flex;gap:10px;align-items:flex-start}
.legend .swatch{flex:none;width:18px;height:18px;border-radius:50%;margin-top:1px}
.swatch.live{background:var(--live)}
.swatch.mod{border:3px solid var(--mod)}
.outline{font-size:13.5px;color:var(--muted);border-top:1px solid var(--line-soft);padding-top:12px;min-height:58px}
.outline b{color:var(--text);font-weight:600}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;margin-bottom:20px;overflow-x:auto;padding:4px;background:var(--well);border-radius:var(--r);width:max-content;max-width:100%}
.tabs button{background:transparent;border:0;border-radius:var(--r-sm);padding:9px 16px;color:var(--muted);font-size:15px;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--text);background:var(--raise);box-shadow:inset 0 -2px 0 var(--accent)}

/* ---------- buttons table ---------- */
.shiftbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--panel);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.shiftbar .help{flex-basis:100%}
.tablewrap{overflow-x:auto}
table.map{width:100%;border-collapse:collapse}
table.map th,table.map td{padding:9px 10px;text-align:left;vertical-align:top}
table.map thead th{font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
table.map tbody tr.grp td{padding:20px 10px 6px;font-weight:700;color:var(--muted);font-size:13.5px}
table.map tbody tr.row{border-top:1px solid var(--line-soft)}
table.map tbody tr.row th{width:200px;font-weight:400}
tr.row .bname{font-weight:600;display:flex;align-items:center;gap:8px}
tr.row .bcode{color:var(--faint);font-size:12px;padding-left:18px}
tr.row .bname::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--line);flex:none;transition:background .06s}
tr.row.on .bname::before{background:var(--live);box-shadow:0 0 0 3px rgba(255,210,63,.22)}
tr.row.focus{background:rgba(62,198,255,.08)}
tr.row .note{color:var(--muted);font-size:12.5px;margin-top:3px;padding-left:18px}
.te{display:flex;flex-direction:column;gap:6px}
.te .line{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.te select{max-width:240px}
.te .own select{border-color:var(--mod);box-shadow:0 0 0 1px rgba(62,198,255,.25)}
.te input.keyf{width:150px}
.te .rec.on{background:var(--live);color:var(--live-ink);border-color:var(--live)}

/* ---------- cards / sliders ---------- */
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.card{background:var(--panel);border-radius:var(--r-lg);padding:18px 20px}
.card h3{margin:0;font-size:19px;font-weight:700}
.card .head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card .head .r{margin-left:auto}
.viz{display:flex;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.viz canvas{background:var(--well);border-radius:var(--r)}
.vcap{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;gap:12px}
.vcap i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 170px 54px 28px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line-soft)}
.srow label{font-weight:600;font-size:14.5px}
.srow output{text-align:right;font-size:14.5px;font-weight:600}
.srow .reset[hidden]{display:inline-block !important;visibility:hidden}
.crow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line-soft)}
.crow label{font-weight:600;font-size:14.5px}
.bars{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.bar{height:14px;border-radius:7px;background:var(--well);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:7px}
.bar.raw i{background:var(--live)}
.bar.out i{background:var(--mod)}
.smods{display:flex;flex-direction:column;gap:10px}
.smod{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;background:var(--well);border-radius:var(--r);padding:12px 14px}
.smod label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.smod input[type=range]{width:130px}

/* ---------- power-ups ---------- */
.target{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border-radius:var(--r-lg);padding:12px 16px;margin-bottom:8px}
.target .emo{font-size:26px}
.combos{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.combo{position:relative;text-align:left;border:2px solid transparent;border-radius:var(--r-lg);padding:16px 18px;background:linear-gradient(135deg,var(--raise),var(--panel));display:flex;flex-direction:column;gap:6px;min-height:132px}
.combo:hover{border-color:var(--line)}
.combo .emo{font-size:30px}
.combo b{font-size:18px}
.combo span{color:var(--muted);font-size:13.5px}
.combo.on{border-color:var(--mod);background:linear-gradient(135deg,#1c4a6e,var(--panel))}
.combo.on::after{content:"On";position:absolute;top:14px;right:14px;background:var(--mod);color:var(--mod-ink);font-weight:700;font-size:12.5px;border-radius:999px;padding:2px 10px}
.pugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.pu{background:var(--panel);border-radius:var(--r-lg);padding:16px 18px;display:flex;flex-direction:column;gap:10px;border:2px solid transparent;transition:border-color .15s,background .15s}
.pu.on{border-color:rgba(62,198,255,.55);background:linear-gradient(160deg,#1b3a63,var(--panel) 60%)}
.pu .top3{display:flex;gap:14px;align-items:flex-start}
.pu .badge{flex:none;width:48px;height:48px;border-radius:14px;background:var(--well);display:grid;place-items:center;font-size:26px}
.pu.on .badge{background:rgba(62,198,255,.18)}
.pu .txt{flex:1;min-width:0}
.pu .txt b{font-size:17px;display:block;margin-bottom:2px}
.pu .txt p{margin:0;color:var(--muted);font-size:14px}
.risk{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:12.5px;font-weight:600;color:#ffcf7a;background:rgba(255,184,64,.12);border-radius:999px;padding:2px 10px}
.pu .params{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line-soft);padding-top:10px}
.pu .prm{display:grid;grid-template-columns:minmax(0,1fr) 150px 52px;gap:10px;align-items:center;font-size:14px}
.pu .prm.sel{grid-template-columns:minmax(0,1fr) auto}
.pu .prm output{text-align:right;font-weight:600}
.pu .from{font-size:12.5px;color:var(--muted)}

/* ---------- crosshair ---------- */
.xlayout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
.xprev{position:relative;height:380px;border-radius:var(--r-xl);overflow:hidden;display:grid;place-items:center;background:#223}
.xprev.dark{background:radial-gradient(ellipse at 50% 120%,#3b4d3a 0%,#1d2a22 45%,#0f1612 100%)}
.xprev.bright{background:linear-gradient(180deg,#bfe3ff 0%,#e9f3ff 48%,#c9b48a 49%,#a58b5e 100%)}
.xprev.busy{background:repeating-linear-gradient(45deg,#4b3b2b 0 18px,#6f5a3d 18px 36px),#4b3b2b}
.xprev img.x1{image-rendering:pixelated;position:relative;z-index:2}
.xprev .zoom{position:absolute;right:14px;bottom:14px;width:150px;height:150px;border-radius:50%;border:3px solid rgba(255,255,255,.7);overflow:hidden;display:grid;place-items:center;background:inherit;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.xprev .zoom img{image-rendering:pixelated;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:none}
.xprev .bgpick{position:absolute;left:14px;top:14px;display:flex;gap:6px;z-index:3}
.xprev .bgpick button{width:30px;height:30px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.6)}
.xprev .tag{position:absolute;left:14px;bottom:14px;background:rgba(0,0,0,.55);color:#fff;font-size:13px;border-radius:999px;padding:4px 12px;z-index:3}
.styles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.styles button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:var(--r);background:var(--well);border:2px solid transparent;font-size:13px}
.styles button[aria-pressed=true]{border-color:var(--mod);background:#1b3a63}
.styles img{height:36px;image-rendering:pixelated}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.swatches button{width:30px;height:30px;padding:0;border-radius:50%;border:3px solid transparent}
.swatches button[aria-pressed=true]{border-color:#fff}
.seg{display:flex;background:var(--well);border-radius:var(--r);padding:4px;gap:4px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;border-radius:var(--r-sm);padding:8px 10px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--raise);color:var(--text);box-shadow:inset 0 -2px 0 var(--mod)}

/* ---------- setup check ---------- */
.checks{display:flex;flex-direction:column;gap:12px;max-width:860px}
.check{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--panel);border-radius:var(--r-lg);padding:16px 18px}
.check .st{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--well)}
.check.good .st{background:rgba(62,230,160,.16)}
.check.bad .st{background:rgba(255,107,107,.16)}
.check.info .st{background:rgba(62,198,255,.14)}
.check b{display:block;font-size:16px}
.check p{margin:2px 0 0;color:var(--muted);font-size:14px}
.check code{background:var(--well);border-radius:6px;padding:1px 6px;font-size:12.5px;word-break:break-all}

/* ---------- macros ---------- */
.mac{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px}
.mlist{display:flex;flex-direction:column;gap:3px}
.mlist h4{margin:10px 10px 4px;font-size:13px;color:var(--muted);font-weight:600}
.mlist .nav small{color:var(--faint)}
.steps{display:flex;flex-direction:column;margin:10px 0}
.step{display:grid;grid-template-columns:30px 140px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line-soft)}
.step .n{color:var(--faint);padding-top:8px;text-align:right}
.step .fields{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.step .fields label{font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.step .ctl{display:flex;gap:2px}
.addsteps{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.timeline{position:relative;height:28px;background:var(--well);border-radius:var(--r-sm);margin:6px 0 4px;overflow:hidden}
.timeline span{position:absolute;top:5px;bottom:5px;border-radius:4px;background:var(--mod)}
.timeline span.stick{background:var(--live);top:15px}
.recbar{display:flex;align-items:center;gap:12px;background:var(--well);border-radius:var(--r);padding:10px 14px;margin:12px 0}
.recdot{width:12px;height:12px;border-radius:50%;background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

/* ---------- forms ---------- */
.form{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px 24px;align-items:center;max-width:880px}
.form .lab{font-weight:600}
.form .lab .help{font-weight:400}
.autotable{display:flex;flex-direction:column;gap:8px}
.autotable .ar{display:flex;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border-radius:999px;padding:4px 12px;font-size:13.5px;background:var(--raise)}
.warnlist{margin:6px 0 0;padding-left:18px;color:#ffd6dd;font-size:14px}
.emogrid{display:grid;grid-template-columns:repeat(8,44px);gap:6px}
.emogrid button{width:44px;height:44px;padding:0;font-size:22px;border-radius:var(--r-sm);background:var(--well);border:2px solid transparent;font-family:var(--emoji)}
.emogrid button[aria-pressed=true]{border-color:var(--mod);background:#1b3a63}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:34px;height:34px;padding:0;border-radius:50%;border:3px solid transparent}
.colors button[aria-pressed=true]{border-color:#fff}

/* ---------- dialog / toast ---------- */
dialog{border:0;border-radius:var(--r-xl);padding:0;background:var(--panel);color:var(--text);width:min(560px,92vw);box-shadow:0 30px 80px rgba(0,0,0,.55)}
dialog::backdrop{background:rgba(5,8,20,.65);backdrop-filter:blur(2px)}
dialog .dh{padding:20px 24px 4px;font-size:21px;font-weight:700}
dialog .db{padding:10px 24px 8px;display:flex;flex-direction:column;gap:14px}
dialog .df{padding:14px 24px 20px;display:flex;gap:10px;justify-content:flex-end}
dialog label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
dialog textarea{width:100%;min-height:120px;font-family:Consolas,monospace;font-size:12.5px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:#0b1024;border:1px solid var(--line);padding:11px 18px;border-radius:999px;transition:all .2s;pointer-events:none;z-index:60;font-weight:600}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.undo{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 18px}
#toast.undo button{border-radius:999px;background:var(--mod);color:var(--mod-ink);border-color:var(--mod);font-weight:700}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:22px 0 4px}
.filters .chip{border:1px solid var(--line);background:transparent;padding:6px 14px;font-size:14px}
.filters .chip[aria-pressed=true]{background:var(--mod);color:var(--mod-ink);border-color:var(--mod);font-weight:700}
.filters input{flex:1;min-width:200px;max-width:320px;border-radius:999px;padding:8px 16px}
/* packs */
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.pack{background:var(--panel);border-radius:var(--r-xl);padding:20px;display:flex;flex-direction:column;gap:10px;border:2px solid transparent;position:relative;overflow:hidden}
.pack::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--pc)}
.pack .emo.big{font-size:40px;line-height:1}
.pack b{font-size:19px}
.pack p{margin:0;color:var(--muted);font-size:14px}
.pack ul{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px;line-height:1.55}
.pack .foot{margin-top:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:6px}
.pack.have{border-color:var(--line)}
/* help */
.faq{display:flex;flex-direction:column;gap:10px;max-width:880px}
.faq details{background:var(--panel);border-radius:var(--r-lg);padding:14px 18px}
.faq summary{cursor:pointer;font-weight:700;font-size:16px;list-style:none;display:flex;gap:10px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"＋";margin-left:auto;color:var(--muted)}
.faq details[open] summary::after{content:"－"}
.faq details p,.faq details li{color:var(--muted);font-size:14.5px}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;max-width:1100px}
.key{background:var(--panel);border-radius:var(--r-lg);padding:16px;display:flex;gap:12px;align-items:center}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;padding:0 10px;border-radius:9px;background:var(--well);border:1px solid var(--line);border-bottom-width:3px;font-weight:700;font-size:14px}
/* welcome */
.welcome{max-width:880px;margin:10px auto}
.welcome h1{font-family:var(--font-cond);font-size:56px;line-height:1;margin:0 0 8px}
.steps3{display:flex;gap:8px;margin:18px 0 26px}
.steps3 span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.trylist{display:grid;gap:10px;margin-top:14px}
.tryitem{display:flex;gap:14px;align-items:center;padding:12px 16px;border-radius:var(--r);background:var(--well);transition:background .2s}
.tryitem .emo{font-size:24px}.tryitem p{margin:2px 0 0}
.tryitem.done{background:linear-gradient(135deg,#1c6f93,#2a9fcf)}
.tryitem.done .help{color:#e8f6ff}
.feel{display:flex;gap:14px 20px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin:0 0 14px}
.feel.small{justify-content:flex-start;gap:10px;font-size:14px;color:var(--muted)}
.feelbtns{display:flex;gap:6px;flex-wrap:wrap}
.steps3 span.on{background:linear-gradient(90deg,var(--brand),var(--violet))}
.bigcard{background:var(--panel);border-radius:var(--r-xl);padding:28px}
.gamechips{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:16px}
.gamechips button{display:flex;align-items:center;gap:10px;padding:14px;border-radius:var(--r-lg);background:var(--well);border:2px solid transparent;font-size:15.5px;text-align:left}
.gamechips button .emo{font-size:26px}
.gamechips button[aria-pressed=true]{border-color:var(--mod);background:#1b3a63}
.pressme{display:grid;place-items:center;height:150px;border-radius:var(--r-lg);background:var(--well);font-size:20px;font-weight:700;margin-top:16px;transition:background .2s}
.pressme.got{background:linear-gradient(135deg,#1c6f93,#2a9fcf)}
.batt{font-size:13px;color:var(--muted);margin-left:2px}
.batt.low{color:var(--warn);font-weight:700}
.hist{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow:auto;max-width:620px}
.hist div{display:flex;align-items:center;gap:10px;background:var(--well);border-radius:var(--r-sm);padding:8px 12px}
.hist div span{flex:1}

/* tester + stats */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.tbtn{background:var(--well);border:2px solid var(--line);border-radius:var(--r);padding:10px;text-align:center;font-weight:700;font-size:14px;transition:background .05s}
.tbtn.ok{border-color:#3ee6a0}
.tbtn.on{background:var(--live);color:var(--live-ink);border-color:var(--live)}
.tbtn small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.tbtn.on small{color:var(--live-ink)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.stat{background:var(--panel);border-radius:var(--r-lg);padding:18px}
.stat .big{font-family:var(--font-cond);font-size:38px;font-weight:700;line-height:1.05}
.stat .lbl2{color:var(--muted);font-size:13.5px;margin-top:4px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.badge2{display:flex;gap:14px;align-items:center;background:var(--panel);border-radius:var(--r-lg);padding:14px 16px}
.badge2 .emo{font-size:34px;filter:grayscale(1) opacity(.45)}
.badge2.got .emo{filter:none}
.badge2.got{background:linear-gradient(135deg,#1c3f66,var(--panel));box-shadow:inset 0 0 0 2px rgba(62,198,255,.45)}
.badge2 b{display:block}
.badge2 .prog{height:6px;border-radius:3px;background:var(--well);margin-top:6px;overflow:hidden}
.badge2 .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--violet))}
.themes{display:flex;gap:10px;flex-wrap:wrap}
.themes button{display:flex;flex-direction:column;gap:6px;align-items:center;padding:10px 12px;border-radius:var(--r);border:2px solid transparent;background:var(--well);min-width:96px}
.themes button[aria-pressed=true]{border-color:var(--mod)}
.themes .sw3{display:flex;gap:3px}
.themes .sw3 i{width:16px;height:16px;border-radius:50%}

/* motion + polish */
#view.enter{animation:viewIn .22s ease-out}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
button:active:not(:disabled){transform:scale(.97)}
.pu,.pack,.combo,.stat,.badge2,.card{transition:transform .15s,border-color .15s,background .15s,box-shadow .15s}
.pu:hover,.pack:hover,.combo:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.28)}
.side h2:first-of-type{margin-top:16px}
.nav.sel{box-shadow:inset 3px 0 0 var(--accent)}
/* home */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:28px 30px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:center;
  background:radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--accent) 38%, transparent) 0%, transparent 55%), linear-gradient(135deg,var(--raise),var(--panel))}
.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:280px;height:280px;border-radius:50%;background:color-mix(in srgb, var(--accent) 22%, transparent);filter:blur(30px);pointer-events:none}
.hero .now{font-size:15px;color:var(--muted);font-weight:600}
.hero .pname2{display:flex;align-items:center;gap:14px;margin:6px 0 4px}
.hero .pname2 .emo{font-size:58px;line-height:1}
.hero .pname2 b{font-family:var(--font-cond);font-size:60px;line-height:1;letter-spacing:.01em}
.hero .meta{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 18px}
.hero .meta span{background:rgba(0,0,0,.25);border-radius:999px;padding:5px 12px;font-size:13.5px}
.bigpower{display:flex;align-items:center;gap:14px;border:0;border-radius:999px;padding:10px 26px 10px 10px;font-size:20px;font-weight:800;background:var(--well);color:var(--muted)}
.bigpower .knob{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--faint);color:var(--bg)}
.bigpower.on{background:linear-gradient(90deg,#1c6f93,#2a9fcf);color:#fff;box-shadow:0 0 0 4px rgba(62,198,255,.25),0 10px 30px rgba(62,198,255,.3)}
.bigpower.on .knob{background:#fff;color:#1c6f93}
.bigpower svg{width:26px;height:26px}
.hero #pad{max-width:380px}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.qs{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:var(--r-lg);padding:14px 16px}
.qs .emo{font-size:26px}
.qs div{flex:1;min-width:0}
.qs b{display:block;font-size:15.5px}
.qs small{color:var(--muted);font-size:12.5px}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.pcard{position:relative;text-align:left;border:2px solid transparent;border-radius:var(--r-lg);padding:16px;background:linear-gradient(160deg,color-mix(in srgb, var(--pc) 30%, var(--panel)),var(--panel) 70%);display:flex;flex-direction:column;gap:8px;min-height:120px}
.pcard .emo{font-size:34px}
.pcard b{font-size:16px}
.pcard small{color:var(--muted)}
.pcard.live{border-color:var(--pc);box-shadow:0 0 0 3px color-mix(in srgb, var(--pc) 30%, transparent)}
.pcard .edit{position:absolute;top:10px;right:10px;padding:2px 8px;font-size:12px;background:rgba(0,0,0,.3);border-color:transparent}
.onchips{display:flex;flex-wrap:wrap;gap:8px}
.onchips span{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.25);border-radius:999px;padding:6px 12px;font-size:13.5px}
@media (max-width:1100px){ .hero{grid-template-columns:1fr} }

@media (max-width:1100px){
  .stage,.duo,.mac,.xlayout{grid-template-columns:1fr}
}
@media (max-width:780px){
  .shell{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px solid var(--line-soft);flex-direction:row;flex-wrap:wrap;padding:10px}
  .side ul{flex-direction:row;flex-wrap:wrap}
  .side h2,.side .grow{display:none}
  .nav{width:auto}
  .top{flex-wrap:wrap;position:static}
  main{padding:16px;overflow-x:hidden}
  .form{grid-template-columns:1fr}
  table.map{min-width:640px}
  .srow{grid-template-columns:1fr 110px 48px 26px}
  .pugrid{grid-template-columns:1fr}
}

/* ---- 6-10: family, streaks, overlays ---- */
.kidchip{display:flex;align-items:center;gap:8px;background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:5px 14px 5px 8px;font-weight:700;color:var(--ink)}
.kidchip .emo{font-size:20px}
.kidpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.kidpick button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 10px;border-radius:var(--r-xl);background:var(--raise);border:3px solid var(--pc,var(--line));font-size:17px}
.kidpick button:hover,.kidpick button:focus{background:color-mix(in srgb,var(--pc,#3ec6ff) 18%,var(--raise))}
.kidpick .emo{font-size:46px}
.kidlist{display:flex;flex-direction:column;gap:8px;max-width:760px}
.kidrow{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:var(--r-lg);padding:10px 14px;border-left:5px solid var(--pc)}
.kidrow .emo{font-size:26px}
.kidrow .r{margin-left:auto}
.weekbars{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;height:170px}
.wcol{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.wstack{flex:1;width:100%;max-width:46px;display:flex;flex-direction:column-reverse;background:var(--well);border-radius:10px;overflow:hidden}
.wstack i{display:block;width:100%}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%}
.streak{display:flex;gap:14px;align-items:center;background:linear-gradient(90deg,color-mix(in srgb,#ff8a3d 22%,var(--panel)),var(--panel));border-radius:var(--r-xl);padding:14px 18px;margin-bottom:16px;max-width:760px}
.streak .emo{font-size:34px}
.streak b{display:block;font-size:20px}
.streak small{color:var(--muted)}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.board li{display:flex;gap:10px;align-items:center;background:var(--well);border-radius:12px;padding:8px 12px}
.board li.me{outline:2px solid var(--accent)}
.board .r{margin-left:auto;font-weight:800}
.astat.win{outline:3px solid var(--live)}
/* ---- 5.0: aim lab, lights ---- */
.aimmodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.aimmodes button{display:flex;gap:12px;align-items:center;text-align:left;padding:14px 16px;border-radius:var(--r-lg);background:var(--panel);border:2px solid transparent}
.aimmodes button[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel))}
.aimmodes .emo{font-size:28px}
.aimmodes b{display:block;font-size:16px}
.aimmodes small{color:var(--muted);font-size:12.5px;line-height:1.35;display:block}
.aimbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:16px 0 12px}
.aimbar input[type=range]{width:220px}
.aimwrap{position:relative;border-radius:var(--r-xl);overflow:hidden;border:2px solid var(--line)}
.aimcv{display:block;width:100%;height:420px}
.aimover{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,12,28,.55)}
.aimover[hidden]{display:none}
.aimcard{background:var(--panel);border-radius:var(--r-xl);padding:24px 30px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;max-width:380px;box-shadow:0 20px 50px #0008}
.aimres{background:var(--panel);border-radius:var(--r-xl);padding:20px;margin-top:16px;display:flex;flex-direction:column;gap:16px}
.aimhead{display:flex;gap:14px;align-items:center}
.astats{display:flex;gap:12px;flex-wrap:wrap}
.astat{background:var(--well);border-radius:var(--r-lg);padding:12px 18px;min-width:120px}
.astat b{display:block;font-size:26px}
.astat small{color:var(--muted)}
.tips{display:flex;flex-direction:column;gap:8px}
.tip{display:flex;gap:12px;align-items:center;background:var(--well);border-radius:var(--r-lg);padding:10px 14px}
.tip .emo{font-size:22px}
.tip button{margin-left:auto;white-space:nowrap}
.lights{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.light{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;text-align:left;padding:14px;border-radius:var(--r-lg);background:var(--panel);border:2px solid transparent}
.light[aria-pressed=true]{border-color:var(--accent)}
.light .ldot{grid-row:span 2;width:30px;height:30px;border-radius:50%;background:var(--accent);box-shadow:0 0 16px var(--accent)}
.light small{color:var(--muted);font-size:12.5px;line-height:1.35}
.l-breathe .ldot{animation:breathe 3s ease-in-out infinite}
.l-rainbow .ldot{background:conic-gradient(#ff3b3b,#ffd23f,#3ee6a0,#3ec6ff,#7c5cff,#ff5fa2,#ff3b3b);animation:spinr 4s linear infinite;box-shadow:0 0 16px #ff5fa288}
.l-battery .ldot{background:linear-gradient(#3ee6a0 0 60%,#ffd23f 60% 85%,#ff6b6b 85%);box-shadow:none}
.l-off .ldot{background:#0b1024;box-shadow:inset 0 0 0 2px var(--line)}
.l-auto .ldot{background:linear-gradient(135deg,var(--accent),#7c5cff)}
@keyframes breathe{0%,100%{opacity:.25;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
@keyframes spinr{to{transform:rotate(360deg)}}
.livedot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;box-shadow:0 0 10px currentColor;border:1px solid #fff4}
button.link{background:none;border:0;padding:0;color:var(--mod);text-decoration:underline;font:inherit;cursor:pointer}
/* ---- 3.0: my games, controller navigation, comfort ---- */
.nudge{display:flex;align-items:center;gap:14px;width:100%;margin-top:18px;padding:14px 18px;border-radius:var(--r-xl);text-align:left;
  background:linear-gradient(90deg,color-mix(in srgb,var(--live) 22%,var(--panel)),var(--panel));border:2px solid color-mix(in srgb,var(--live) 45%,transparent)}
.nudge .emo{font-size:30px}
.nudge b{display:block;font-size:17px}
.nudge small{color:var(--muted);font-size:13.5px}
.nudge .go{margin-left:auto;background:var(--live);color:#1a1300;font-weight:800;padding:8px 16px;border-radius:999px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.game{background:var(--panel);border-radius:var(--r-xl);overflow:hidden;display:flex;flex-direction:column;border:2px solid transparent}
.game.set{border-color:var(--line)}
.gart{aspect-ratio:460/215;position:relative;display:grid;place-items:center;
  background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--pc) 55%,transparent),transparent 60%),linear-gradient(135deg,var(--raise),var(--well))}
.gart img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.gart.pic img{opacity:1}
.gart .emo{font-size:46px;filter:drop-shadow(0 4px 10px #0006)}
.gart.pic .emo{position:absolute;right:10px;bottom:8px;font-size:26px;background:var(--well);border-radius:12px;padding:4px 6px;line-height:1}
.gbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.gbody b{font-size:17px;line-height:1.25}
.gsrc{color:var(--muted);font-size:13px}
.gfoot{margin-top:auto;padding-top:8px;display:flex;gap:8px;align-items:center}
.gfoot select{flex:1;min-width:0}
.gok{font-weight:700;white-space:nowrap;font-size:14px}
.gempty{background:var(--panel);border-radius:var(--r-xl);padding:34px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.gempty .emo{font-size:44px}
.spin{display:inline-block;animation:wob 1.1s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg) scale(1.08)}}
.found{background:color-mix(in srgb,var(--live) 14%,var(--well));border-radius:var(--r-lg);padding:10px 14px;margin-top:12px;font-weight:600}
body.padnav :focus{outline:3px solid var(--live) !important;outline-offset:3px;box-shadow:0 0 0 7px color-mix(in srgb,var(--live) 28%,transparent) !important}
body.padnav{cursor:none}
body.padnav #view{padding-bottom:84px}
#navhint{position:fixed;left:50%;bottom:72px;transform:translateX(-50%) translateY(16px);opacity:0;pointer-events:none;z-index:55;
  display:flex;gap:18px;align-items:center;background:#0b1024ee;border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:600;white-space:nowrap;transition:all .2s}
body.padnav #navhint{opacity:1;transform:translateX(-50%)}
#navhint span{display:flex;align-items:center;gap:6px}
#navhint .gl{font-style:normal;display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:999px;background:var(--raise);border:1px solid var(--line);font-size:12.5px;font-weight:800}
#navhint .gl.wide{border-radius:7px;padding:0 6px}
body.calm *,body.calm *::before,body.calm *::after{transition:none !important;animation:none !important;scroll-behavior:auto !important}
</style>
</head>
<body>
<header class="top">
  <div class="logo"><img src="/icon.png" alt="">Clutch</div>
  <div class="pill off" id="status"><span class="dot"></span><span id="statusText">Connecting…</span></div><span class="batt" id="batt" hidden></span>
  <button id="kidChip" class="kidchip" hidden onclick="whoIsPlaying()"></button>
  <label class="playing">Playing <select id="liveProfile" aria-label="Profile your controller is using"></select></label>
  <div class="spacer"></div>
  <span class="save-state" id="saveState"></span>
  <button class="ghost small" id="undoBtn" hidden>Undo changes</button>
  <button class="primary" id="saveBtn" hidden>Save changes</button>
  <button class="power on" id="power" role="switch" aria-checked="true" title="Turn all mods on or off (controller shortcut: hold Guide + press Back)">
    <span class="knob"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 7.5a8 8 0 1 0 11.4 0"/></svg></span>
    <span id="powerText">Mods on</span>
  </button>
</header>

<div class="shell">
  <nav class="side" aria-label="Main">
    <button class="nav" data-view="home"><span class="emo">🏠</span><span class="pname">Home</span></button>
    <h2>Play</h2>
    <button class="nav" data-view="powerups"><span class="emo">⚡</span><span class="pname">Power-ups</span></button>
    <button class="nav" data-view="crosshair"><span class="emo">🎯</span><span class="pname">Crosshair</span></button>
    <button class="nav" data-view="aim"><span class="emo">🏹</span><span class="pname">Aim Lab</span></button>
    <button class="nav" data-view="packs"><span class="emo">🕹️</span><span class="pname">My games</span></button>
    <button class="nav" data-view="stats"><span class="emo">📊</span><span class="pname">Stats</span></button>
    <h2>Profiles</h2>
    <ul id="profileList"></ul>
    <button class="ghost small add" id="newProfile">+ New profile</button>
    <div class="grow"></div>
    <h2>Tools</h2>
    <button class="nav" data-view="tester"><span class="emo">🧪</span><span class="pname">Controller test</span></button>
    <button class="nav" data-view="setup"><span class="emo">🔧</span><span class="pname">Setup check</span><span class="badge" id="setupBadge" hidden>!</span></button>
    <button class="nav" data-view="help"><span class="emo">❓</span><span class="pname">Help</span></button>
    <button class="nav" data-view="settings"><span class="emo">⚙️</span><span class="pname">Settings</span><span class="badge" id="warnBadge" hidden></span></button>
  </nav>
  <main id="main">
    <div class="banner" id="fatal" hidden></div>
    <section id="view"></section>
  </main>
</div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<div id="navhint" aria-hidden="true"></div>
<datalist id="keyNames"></datalist>
<datalist id="recentApps"></datalist>

<script>
"use strict";
const TOKEN = "__PANEL_TOKEN__";
const APP_MODE = new URLSearchParams(location.search).has("app");

/* ================================================================ names */
const NAMES = {
  a:"A / Cross", b:"B / Circle", x:"X / Square", y:"Y / Triangle",
  lb:"LB / L1", rb:"RB / R1", lt:"LT / L2", rt:"RT / R2",
  back:"Back / Share", start:"Start / Options", guide:"Guide / PS",
  l3:"L3 (left stick click)", r3:"R3 (right stick click)",
  dpad_up:"D-pad up", dpad_down:"D-pad down", dpad_left:"D-pad left", dpad_right:"D-pad right",
  misc1:"Share / Capture", paddle1:"Paddle 1", paddle2:"Paddle 2", paddle3:"Paddle 3", paddle4:"Paddle 4",
  touchpad:"Touchpad click",
  tp_left:"Touchpad left half", tp_right:"Touchpad right half", tp_tl:"Touchpad top-left", tp_tr:"Touchpad top-right", tp_bl:"Touchpad bottom-left", tp_br:"Touchpad bottom-right",
  ls_up:"Left stick up", ls_down:"Left stick down", ls_left:"Left stick left", ls_right:"Left stick right",
  rs_up:"Right stick up", rs_down:"Right stick down", rs_left:"Right stick left", rs_right:"Right stick right",
};
const SHORT = {a:"A",b:"B",x:"X",y:"Y",lb:"LB",rb:"RB",lt:"LT",rt:"RT",back:"Back",start:"Start",guide:"Guide",
  l3:"L3",r3:"R3",dpad_up:"D-pad up",dpad_down:"D-pad down",dpad_left:"D-pad left",dpad_right:"D-pad right",
  misc1:"Share",paddle1:"Paddle 1",paddle2:"Paddle 2",paddle3:"Paddle 3",paddle4:"Paddle 4",touchpad:"Touchpad",
  tp_left:"Pad left",tp_right:"Pad right",tp_tl:"Pad top-left",tp_tr:"Pad top-right",tp_bl:"Pad bottom-left",tp_br:"Pad bottom-right",
  ls_up:"Left stick up",ls_down:"Left stick down",ls_left:"Left stick left",ls_right:"Left stick right",
  rs_up:"Right stick up",rs_down:"Right stick down",rs_left:"Right stick left",rs_right:"Right stick right"};
const MOUSE_LABEL = {left:"Left click",right:"Right click",middle:"Middle click",x1:"Mouse back",x2:"Mouse forward",
  wheel_up:"Scroll up",wheel_down:"Scroll down",wheel_left:"Scroll left",wheel_right:"Scroll right"};
const GROUPS = [
  ["Face buttons", ["a","b","x","y"]],
  ["Shoulders and triggers", ["lb","rb","lt","rt"]],
  ["D-pad", ["dpad_up","dpad_down","dpad_left","dpad_right"]],
  ["Menu buttons and stick clicks", ["back","start","guide","l3","r3"]],
  ["Extra buttons (Elite, DualSense, Edge, Switch)", ["misc1","paddle1","paddle2","paddle3","paddle4","touchpad"]],
  ["Touchpad zones", ["tp_left","tp_right","tp_tl","tp_tr","tp_bl","tp_br"]],
  ["Stick directions", ["ls_up","ls_down","ls_left","ls_right","rs_up","rs_down","rs_left","rs_right"]],
];
const XBOX = ["a","b","x","y","lb","rb","back","start","guide","l3","r3","dpad_up","dpad_down","dpad_left","dpad_right"];
const STICK_DIRS = ["ls_up","ls_down","ls_left","ls_right","rs_up","rs_down","rs_left","rs_right"];
const MACRO_MODES = {
  once:"Plays the whole thing once per press",
  hold:"Plays while you hold the button, lets go when you release",
  repeat:"Loops for as long as you hold the button",
  toggle:"Press once to start looping, press again to stop",
};
const STEP_TYPES = {tap:"Tap", down:"Hold down", up:"Let go", wait:"Wait", stick:"Move stick"};
const EMOJIS = ["🎮","🎯","🕹️","🖱️","🔥","⚡","🏎️","⚽","🏀","🧟","🐉","👾","🚀","🗡️","🛡️","🏹","🔫","💣","🧱","⛏️","🌌","🦖","🐺","🏆"];
const COLORS = ["#3ec6ff","#ff5fa2","#ffd23f","#7c5cff","#3ee6a0","#ff8a3d","#ff6b6b","#c2f970","#f2f5ff"];

/* ================================================================ state */
let META = null, CFG = null, SAVED = "", CFG_MTIME = 0, STATE = null, HEALTH = null;
let view = "powerups", curProfile = null, curTab = "buttons", focusInput = null, curMacro = null, puProfile = null;
let saving = false, saveTimer = null, offline = false, lastView = null;

/* ================================================================ utils */
const $ = (s, r=document) => r.querySelector(s);
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "checked" || k === "disabled" || k === "hidden" || k === "selected") el[k] = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)){
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
const SVGNS = "http://www.w3.org/2000/svg";
function s(tag, attrs, ...kids){
  const el = document.createElementNS(SVGNS, tag);
  for (const [k,v] of Object.entries(attrs||{})) if (v != null) el.setAttribute(k, v);
  for (const c of kids.flat()) if (c != null) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return el;
}
function add(parent, ...kids){ parent.append(...kids.flat(Infinity).filter(k => k != null && k !== false)); }
function sel(options, value, onchange, attrs){
  const el = h("select", Object.assign({onchange: e => onchange(e.target.value)}, attrs||{}));
  for (const o of options){
    if (o.group){ const g = h("optgroup",{label:o.group}); o.items.forEach(i => g.append(h("option",{value:i[0]},i[1]))); el.append(g); }
    else el.append(h("option",{value:o[0]},o[1]));
  }
  el.value = value;
  return el;
}
function swtch(on, onchange, label, attrs){
  const b = h("button", Object.assign({class:"sw", role:"switch", "aria-checked":String(!!on), "aria-label":label, type:"button"}, attrs||{}));
  b.addEventListener("click", () => { const nv = b.getAttribute("aria-checked") !== "true"; b.setAttribute("aria-checked", String(nv)); onchange(nv); });
  return b;
}
const clone = o => o === undefined ? undefined : JSON.parse(JSON.stringify(o));
const isObj = o => o && typeof o === "object" && !Array.isArray(o);
function merge(a, b){ const out = clone(a) || {}; for (const [k,v] of Object.entries(b||{})){ out[k] = (isObj(v) && isObj(out[k])) ? merge(out[k], v) : clone(v); } return out; }
const getPath = (o, p) => { for (const k of p){ if (!isObj(o)) return undefined; o = o[k]; } return o; };
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const num = (v, d) => { const n = parseFloat(v); return Number.isFinite(n) ? n : d; };
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const listify = v => v == null || v === false ? [] : Array.isArray(v) ? v.filter(Boolean) : (v ? [v] : []);
const pct = v => Math.round(v * 100) + "%";
const times = v => "×" + (+v).toFixed(2);
const pow = v => (+v).toFixed(2);
function toast(msg, undoSnap){
  const t = $("#toast");
  t.replaceChildren(msg);
  t.classList.toggle("undo", !!undoSnap);
  if (undoSnap) t.append(h("button", {class:"small", onclick: () => { CFG = JSON.parse(undoSnap); changed(); renderAll(); t.classList.remove("show"); toast("↩️ Undone"); }}, "Undo"));
  t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), undoSnap ? 4500 : 2400);
}
const snap = () => JSON.stringify(CFG);
function store(k, v){ try { localStorage.setItem("clutch_"+k, JSON.stringify(v)); } catch(e){} }
function recall(k, d){ try { const v = localStorage.getItem("clutch_"+k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } }
function setIn(o, path, v){ for (const k of path.slice(0,-1)){ if (!isObj(o[k])) o[k] = {}; o = o[k]; } o[path[path.length-1]] = v; }
function delIn(o, path){
  const chain = [o];
  for (const k of path.slice(0,-1)){ const n = chain[chain.length-1][k]; if (!isObj(n)) return; chain.push(n); }
  delete chain[chain.length-1][path[path.length-1]];
  for (let i = chain.length-1; i > 0; i--){ if (Object.keys(chain[i]).length === 0) delete chain[i-1][path[i-1]]; else break; }
}

async function api(path, body){
  const r = await fetch(path, {method: body === undefined ? "GET" : "POST", cache:"no-store",
    headers:{"X-Panel-Token": TOKEN, "Content-Type":"application/json"},
    body: body === undefined ? undefined : JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}
const action = (name, extra) => api("/api/action", Object.assign({name}, extra || {}));

/* ================================================================ dialogs */
let dlgDone = null;
const closeDialog = v => { if (dlgDone) dlgDone(v); };
function dialog({title, body, actions}){
  if (dlgDone) dlgDone(undefined);   // only one dialog at a time
  return new Promise(resolve => {
    const d = $("#dlg");
    let settled = false;
    const done = v => {
      if (settled) return; settled = true;
      d.onclose = null; dlgDone = null;   // so this close can't cancel the next dialog
      if (d.open) d.close();
      resolve(v);
    };
    dlgDone = done;
    const foot = h("div", {class:"df"}, ...(actions || [{label:"OK", value:true, primary:true}]).map(a =>
      h("button", {class: a.primary ? "primary" : a.danger ? "danger" : "ghost", type:"button", onclick: () => {
        if (a.check && !a.check()) return; done(a.value); }}, a.label)));
    d.replaceChildren(h("div", {class:"dh"}, title), h("div", {class:"db"}, body), foot);
    d.onclose = () => { if (!d.open) done(undefined); };  // a late close event from an earlier dialog is ignored
    d.oncancel = () => {};
    d.showModal();
    const first = d.querySelector("input,textarea,select"); if (first) first.focus();
  });
}
async function confirmBox(title, text, yes="Yes", danger=false){
  return !!(await dialog({title, body: h("p", {style:"margin:0;color:var(--muted)"}, text),
    actions:[{label:"Cancel", value:false}, {label:yes, value:true, primary:!danger, danger}]}));
}
async function askName(title, value, hint){
  const f = h("input", {type:"text", value: value || "", maxlength:"32", "aria-label":"Name"});
  f.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); $("#dlg .df .primary").click(); } });
  const ok = await dialog({title, body: h("label", {class:"f"}, hint || "Name", f),
    actions:[{label:"Cancel", value:false}, {label:"OK", value:true, primary:true, check: () => f.value.trim().length > 0}]});
  return ok ? f.value.trim() : null;
}

/* ================================================================ profile model */
function resolve(name, seen){
  seen = seen || new Set();
  const ps = CFG.profiles;
  if (seen.has(name)) return {};
  seen.add(name);
  const p = ps[name] || {};
  const own = clone(p); delete own.extends;
  if (p.extends && ps[p.extends]) return merge(resolve(p.extends, seen), own);
  return own;
}
function parentOf(name){ const p = CFG.profiles[name] || {}; return p.extends && CFG.profiles[p.extends] ? resolve(p.extends) : {}; }
const R = () => resolve(curProfile);
const P = () => parentOf(curProfile);
const own = () => CFG.profiles[curProfile];
const isOwn = path => getPath(own(), path) !== undefined;
const setOwn = (path, val) => setIn(own(), path, val);
const clearOwn = path => delIn(own(), path);
function setSmart(path, val, fallback){
  if (val === undefined || same(val, fallback)) clearOwn(path); else setOwn(path, val);
  changed();
}
const defaultTarget = inp => (XBOX.includes(inp) || inp === "lt" || inp === "rt" || inp === "touchpad") ? inp : null;
const pEmoji = n => (resolve(n).emoji) || "🎮";
const pColor = n => (resolve(n).color) || "#3ec6ff";

function desc(t){
  if (Array.isArray(t)) return t.length ? t.map(desc).join(" + ") : "Nothing";
  if (t == null || t === "" || t === "none") return "Nothing";
  t = String(t).toLowerCase();
  if (SHORT[t]) return SHORT[t];
  if (t.startsWith("key:")){ const ks = t.slice(4).split("+").filter(Boolean); return ks.length ? "Key " + ks.map(k => k[0].toUpperCase() + k.slice(1)).join("+") : "Key (not set yet)"; }
  if (t.startsWith("mouse:")) return MOUSE_LABEL[t.slice(6)] || t;
  if (t.startsWith("macro:")) return "Macro “" + t.slice(6) + "”";
  return t;
}
function macroNames(){ return [...new Set([...Object.keys(CFG.macros || {}), ...Object.keys(R().macros || {})])]; }

/* ================================================================ output mode */
const OUT_LABEL = {xbox:"Xbox controller", playstation:"PlayStation controller"};
const globalOutput = () => (CFG && CFG.output) || "xbox";
const profileOutput = n => resolve(n).output || globalOutput();
const psMode = () => (STATE && STATE.output ? STATE.output : profileOutput((STATE && STATE.profile) || curProfile)) === "playstation";
const PS_GLYPH = {a:"✕", b:"○", x:"□", y:"△", lb:"L1", rb:"R1", lt:"L2", rt:"R2", guide:"PS"};
const PS_NAME = {a:"Cross", b:"Circle", x:"Square", y:"Triangle", lb:"L1", rb:"R1", back:"Share", start:"Options", guide:"PS", l3:"L3", r3:"R3", touchpad:"Touchpad"};
const outName = b => (psMode() && PS_NAME[b]) || SHORT[b] || b;

/* ================================================================ saving */
const autoApply = () => recall("autoApply", true);
const dirty = () => CFG && JSON.stringify(CFG) !== SAVED;
function changed(){
  updateSaveUI();
  updatePadMarks();
  if (autoApply()){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 300); }
}
function updateSaveUI(msg, cls){
  const st = $("#saveState"), d = dirty(), manual = !autoApply();
  $("#saveBtn").hidden = !manual; $("#saveBtn").disabled = !d || saving;
  $("#undoBtn").hidden = !manual || !d;
  st.className = "save-state " + (cls || (d && manual ? "dirty" : ""));
  st.textContent = msg || (saving ? "Saving…" : d && manual ? "Unsaved changes" : "");
}
async function save(){
  if (!CFG || saving || !dirty()) return;
  saving = true; updateSaveUI();
  const snapshot = JSON.stringify(CFG);
  try {
    const r = await api("/api/config", {config: JSON.parse(snapshot)});
    SAVED = snapshot; CFG_MTIME = r.mtime;
    saving = false; updateSaveUI();
    if (!autoApply()) toast("✅ Saved. Your controller is using the new settings.");
  } catch(e){
    saving = false; updateSaveUI("Not saved: " + e.message, "err");
    return;
  }
  if (dirty() && autoApply()){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 300); }
}
async function loadConfig(){
  const j = await api("/api/config");
  if (j.error){ showFatal(j.error); return false; }
  CFG = j.config; CFG_MTIME = j.mtime;
  CFG.profiles = CFG.profiles || {};
  if (!Object.keys(CFG.profiles).length) CFG.profiles.Everyday = {};
  for (const k of ["profile_switch","auto_profiles","panel","macros","crosshair","hotkeys","lightbar","quick_menu","controllers","overlay","updates","online_safe"]) if (!isObj(CFG[k])) CFG[k] = {};
  SAVED = JSON.stringify(CFG);
  applyTheme((curKid() && curKid().theme) || CFG.theme); applyUI();
  $("#fatal").hidden = true;
  return true;
}
function showFatal(msg){ const f = $("#fatal"); f.textContent = msg; f.hidden = false; }

/* ================================================================ shell */
function go(v, opts){
  view = v;
  if (opts && opts.profile){ curProfile = opts.profile; curMacro = null; focusInput = null; }
  renderAll();
  window.scrollTo({top:0});
  if (opts && opts.scrollTo) setTimeout(() => { const el = document.getElementById(opts.scrollTo); if (el) el.scrollIntoView({block:"start"}); }, 30);
}
function renderAll(){
  if (!CFG) return;
  if (!CFG.profiles[curProfile]) curProfile = Object.keys(CFG.profiles)[0];
  document.documentElement.style.setProperty("--accent", pColor(view === "profile" ? curProfile : (STATE && STATE.profile) || curProfile));
  renderSidebar(); renderHeader();
  const nk = navKey();
  const v = $("#view");
  v.replaceChildren();
  ({profile: renderProfileView, powerups: renderPowerups, crosshair: renderCrosshair, setup: renderSetup, settings: renderSettings,
    packs: renderPacks, aim: renderAim, help: renderHelp, welcome: renderWelcome, tester: renderTester, stats: renderStats, home: renderHome})[view](v);
  if (lastView !== view){ v.classList.remove("enter"); void v.offsetWidth; v.classList.add("enter"); lastView = view; }
  updateSaveUI();
  updateLive();
  navRestore(nk);
  if (NAV.active) renderNavHint();
}
function renderSidebar(){
  const live = STATE && STATE.profile;
  const hidden = Object.keys(CFG.profiles).filter(n => !profileVisible(n)).length;
  $("#profileList").replaceChildren(...Object.keys(CFG.profiles).filter(n => profileVisible(n) || n === live).map(n =>
    h("li", {}, h("button", {class: "nav" + (view === "profile" && n === curProfile ? " sel" : ""), style:`--pc:${pColor(n)}`,
      onclick: () => go("profile", {profile:n})},
      h("span", {class:"emo"}, pEmoji(n)), h("span", {class:"pname"}, n),
      n === live ? h("span", {class:"live-dot", title:"Your controller is using this one"}) : null))),
    ...(hidden || showAllProfiles ? [h("li", {}, h("button", {class:"link", style:"padding:4px 14px;font-size:13px", onclick: () => { showAllProfiles = !showAllProfiles; renderAll(); }},
      showAllProfiles ? "Show just mine" : `Show ${hidden} more`))] : []));
  document.querySelectorAll(".side .nav[data-view]").forEach(b => b.classList.toggle("sel", b.dataset.view === view));
  const w = (STATE && STATE.warnings || []).length;
  $("#warnBadge").hidden = !w; $("#warnBadge").textContent = w;
  $("#setupBadge").hidden = !setupProblems();
}
function renderHeader(){
  const kc = $("#kidChip"), kk = curKid();
  kc.hidden = !kids().length;
  if (kids().length) kc.replaceChildren(h("span", {class:"emo"}, kk ? kk.emoji || "🙂" : "👥"), kk ? kk.name : "Who's playing?");
  const el = $("#liveProfile");
  if (document.activeElement !== el){
    const names = (STATE && STATE.profiles) || Object.keys(CFG.profiles);
    el.replaceChildren(...names.map(n => h("option", {value:n}, `${CFG.profiles[n] ? pEmoji(n) : "🎮"}  ${n}`)));
    el.value = (STATE && STATE.profile) || "";
    el.disabled = !STATE || offline;
  }
  const on = !STATE || STATE.enabled !== false;
  const pw = $("#power");
  pw.classList.toggle("on", on); pw.setAttribute("aria-checked", String(on));
  $("#powerText").textContent = on ? "Mods on" : "Mods off";
  pw.disabled = !STATE || offline;
}
const BATT = {full:["🔋","Battery full"], max:["🔋","Battery full"], medium:["🔋","Battery OK"], low:["🪫","Battery low"], empty:["🪫","Battery almost empty"], wired:["🔌","Plugged in"]};
function renderBattery(level){
  const b = $("#batt"); const m = BATT[level];
  if (!m){ b.hidden = true; return; }
  b.hidden = false; b.textContent = m[0] + " " + m[1]; b.className = "batt" + (level === "low" || level === "empty" ? " low" : "");
}
function switchLive(name){
  api("/api/profile", {name}).then(() => toast(`${pEmoji(name)} Now playing with ${name}`)).catch(e => toast(e.message));
}

/* ================================================================ POWER-UPS */
/* Each power-up edits one profile (pu target). get(r) -> params object if on, else null. */
function puTarget(){ if (!puProfile || !CFG.profiles[puProfile]) puProfile = (STATE && STATE.profile && CFG.profiles[STATE.profile]) ? STATE.profile : curProfile; return puProfile; }
const PT = () => CFG.profiles[puTarget()];
const PR = () => resolve(puTarget());
const PPar = () => parentOf(puTarget());
function off(path, offVal){ if (getPath(PPar(), path) !== undefined) setIn(PT(), path, offVal); else delIn(PT(), path); }
function upsertSM(entry){ const list = (PR().stick_mods || []).filter(m => m.id !== entry.id); list.push(entry); PT().stick_mods = list; }
function removeSM(id){ const list = (PR().stick_mods || []).filter(m => m.id !== id); if (list.length || (PPar().stick_mods || []).length) PT().stick_mods = list; else delete PT().stick_mods; }
const findSM = (r, id) => (r.stick_mods || []).find(m => m.id === id);
function setMacro(name, m){ PT().macros = PT().macros || {}; PT().macros[name] = m; }
function dropMacro(name){ if (PT().macros){ delete PT().macros[name]; if (!Object.keys(PT().macros).length) delete PT().macros; } }
function setRemap(inp, t){ setIn(PT(), ["remap", inp], t); }
function clearRemap(inp, onlyIf){ const cur = getPath(PT(), ["remap", inp]); if (onlyIf && !onlyIf(cur)) return; off(["remap", inp], defaultTarget(inp) || "none"); }
const remapHas = (r, inp, t) => listify(getPath(r, ["remap", inp])).includes(t);

  if (CFG.start_profile === old) CFG.start_profile = Object.keys(CFG.profiles)[0];
  for (const [k, v] of Object.entries(CFG.auto_profiles || {})) if (v === old) delete CFG.auto_profiles[k];
  curProfile = Object.keys(CFG.profiles)[0]; changed(); renderAll();
}
function exportProfile(){
  const prof = resolve(curProfile);
  const used = new Set(); walkCollect(prof, used);
  const macros = {}; for (const n of used) if (CFG.macros[n] && !(prof.macros || {})[n]) macros[n] = CFG.macros[n];
  if (Object.keys(macros).length) prof.macros = Object.assign({}, macros, prof.macros || {});
  const code = "CLUTCH1:" + btoa(unescape(encodeURIComponent(JSON.stringify({name: curProfile, profile: prof}))));
  const ta = h("textarea", {readonly:true}, code);
  dialog({title:"Share " + curProfile, body:[h("p", {class:"help", style:"margin:0"}, "Send this code to a friend. They paste it in with “Paste a code”."), ta],
    actions:[{label:"Close", value:false}, {label:"Copy code", value:true, primary:true, check: () => { ta.select(); try { navigator.clipboard.writeText(code); } catch(e){ document.execCommand("copy"); } toast("📋 Copied"); return true; }}]});
}
function walkCollect(o, set){
  if (Array.isArray(o)) o.forEach(v => walkCollect(v, set));
  else if (isObj(o)) Object.values(o).forEach(v => walkCollect(v, set));
  else if (typeof o === "string" && o.startsWith("macro:")) set.add(o.slice(6));
}
async function importProfile(){
  const ta = h("textarea", {placeholder:"CLUTCH1:…"});
  const ok = await dialog({title:"Paste a profile code", body:[ta], actions:[{label:"Cancel", value:false}, {label:"Add profile", value:true, primary:true, check: () => ta.value.trim().startsWith("CLUTCH1:")}]});
  if (!ok) return;
  try {
    const data = JSON.parse(decodeURIComponent(escape(atob(ta.value.trim().slice(8)))));
    if (!isObj(data.profile)) throw new Error("bad");
    const name = uniqueName(String(data.name || "Shared profile").slice(0, 32));
    delete data.profile.extends;
    CFG.profiles[name] = data.profile;
    changed(); go("profile", {profile:name}); toast(`📥 Added ${name}`);
  } catch(e){ toast("That code didn't work. Check you copied all of it."); }
}

const packProfile = id => Object.keys(CFG.profiles).find(n => CFG.profiles[n].pack === id);
function addPack(pk, quiet){
  const existing = packProfile(pk.id);
  if (existing) return existing;
  const name = uniqueName(pk.name);
  const base = CFG.profiles.Everyday ? {extends:"Everyday"} : {};
  CFG.profiles[name] = Object.assign(base, {emoji:pk.emoji, color:pk.color, pack:pk.id}, ["minecraft","couch"].includes(pk.id) ? {crosshair_on:false} : {}, pk.make());
  if (pk.exe && !CFG.auto_profiles[pk.exe]) CFG.auto_profiles[pk.exe] = name;
  if (!quiet){ changed(); toast(`${pk.emoji} Added ${name}` + (pk.exe ? `. It turns on by itself when you open the game.` : "")); }
  return name;
}
let packCat = "", packQ = "";

/* ================================================================ WELCOME TOUR */
function tryTasks(hold, menuOn){
  const t = [
    {id:"rt", emoji:"🔫", title:"Pull the right trigger", text:"All the way down, then let go.", test: st => st.raw && st.raw.rt > .5},
    {id:"aim", emoji:"🎯", title:"Spin the right stick", text:"Push it all the way to the edge. That's how you aim.", test: st => st.raw && Math.hypot(st.raw.rx, st.raw.ry) > .7},
  ];
  if (menuOn) t.push({id:"menu", emoji:"📋", title:`Hold ${outName(hold)} by itself`, text:"Keep holding for a second. The quick menu pops up over your games, so you can switch profiles without leaving the game. Let go to close it.", test: st => !!st.menu});
  return t;
}

async function sha(text){
  try { const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("clutch:" + text)); return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join(""); }
  catch(e){ let x = 0; for (const ch of "clutch:" + text) x = (x * 31 + ch.charCodeAt(0)) >>> 0; return "h" + x.toString(16); }
}

  return ok ? f.value : null;
}

function updateTester(){
  const st = STATE; if (!st || !st.connected || !st.raw) return;
  const down = new Set(st.raw.buttons); if (st.raw.lt > .5) down.add("lt"); if (st.raw.rt > .5) down.add("rt");
  let changedSeen = false;
  for (const b of down) if (!tst.seen.has(b)){ tst.seen.add(b); changedSeen = true; }
  document.querySelectorAll(".tbtn").forEach(el => { const b = el.dataset.b; el.classList.toggle("on", down.has(b));
    if (changedSeen && tst.seen.has(b) && !el.classList.contains("ok")){ el.classList.add("ok"); el.querySelector("small").textContent = "works ✓"; } });
  const tc = $("#tCount"); if (tc) tc.textContent = `Buttons (${[...tst.seen].filter(b => TB.slice(0, 17).includes(b)).length} of 17 main buttons work)`;
  for (const side of ["left","right"]){
    const x = side === "left" ? st.raw.lx : st.raw.rx, y = side === "left" ? st.raw.ly : st.raw.ry;
    const m = Math.hypot(x, y), ang = Math.atan2(y, x);
    if (m > .3){ const sec = Math.floor(((ang + Math.PI) / (2 * Math.PI)) * 36) % 36; tst.reach[side][sec] = Math.max(tst.reach[side][sec], Math.min(1.2, m)); }
    const trail = tst.trail[side]; trail.push([x, y]); if (trail.length > 60) trail.shift();
    const cv = $("#tCv_" + side); if (!cv) continue;
    const [ctx, w, hh] = prepCanvas(cv); const cx = w / 2, cy = hh / 2, R = w / 2 - 14;
    ctx.strokeStyle = CSSV("--line"); ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - R, cy); ctx.lineTo(cx + R, cy); ctx.moveTo(cx, cy - R); ctx.lineTo(cx, cy + R); ctx.stroke();
    const r = tst.reach[side];
    if (r.some(v => v > 0)){ ctx.fillStyle = "rgba(62,198,255,.18)"; ctx.strokeStyle = CSSV("--mod"); ctx.lineWidth = 2; ctx.beginPath();
      r.forEach((v, i) => { const a = (i + .5) / 36 * 2 * Math.PI - Math.PI; const px = cx + Math.cos(a) * v * R, py = cy - Math.sin(a) * v * R; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
      ctx.closePath(); ctx.fill(); ctx.stroke(); }
    ctx.strokeStyle = "rgba(255,210,63,.5)"; ctx.lineWidth = 2; ctx.beginPath(); trail.forEach(([tx, ty], i) => { const px = cx + tx * R, py = cy - ty * R; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }); ctx.stroke();
    ctx.fillStyle = CSSV("--live"); ctx.beginPath(); ctx.arc(cx + x * R, cy - y * R, 7, 0, 7); ctx.fill();
    const filled = r.filter(v => v > 0); const avg = filled.length ? filled.reduce((a, b) => a + b, 0) / filled.length : 0;
    const info = $("#tInfo_" + side);
    if (info) info.textContent = filled.length < 30 ? (m < .25 ? `Resting: ${pct(m)}${m > .1 ? " (drifting!)" : ""}. Spin it all the way round` : "Keep spinning…")
      : `Reach ${pct(Math.min(1, avg))} ${avg > .93 ? "✅ healthy" : avg > .8 ? "👍 OK" : "⚠️ weak, might be worn"}`;
  }
  for (const t of ["lt","rt"]){ const v = st.raw[t]; tst.trig[t] = Math.max(tst.trig[t], v);
    const bar = $("#tBar_" + t); if (bar) bar.style.width = pct(v);
    const lab = $("#tTrig_" + t); if (lab) lab.textContent = `Now ${pct(v)}, best ${pct(tst.trig[t])}${tst.trig[t] > .97 ? " ✅" : ""}`; }
  const g = $("#tGyro"); if (g) g.textContent = st.has_gyro && st.gyro ? `Gyro found ✅  Turn: ${st.gyro[0].toFixed(0)}°/s  Tilt: ${st.gyro[1].toFixed(0)}°/s. Move the controller to see it change.` : "This controller has no motion sensor (only PlayStation and Switch Pro controllers do).";
}

/* ================================================================ SOUNDS */
let actx = null;
const soundsOn = () => !CFG || !CFG.ui || CFG.ui.sounds !== false;
const SFX = {tick:[[880, .025]], tap:[[660, .04]], up:[[523, .06], [784, .09]], down:[[784, .06], [523, .09]],
  chime:[[659, .07], [880, .07], [1175, .14]], pop:[[740, .05]], nope:[[220, .12]]};
function sfx(name, force){

  const notes = SFX[name]; if (!notes) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    let t = actx.currentTime + .005;

      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d + .02); t += d * .8;
    }
  } catch(e){}
}
const primeAudio = () => { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch(e){} };

window.addEventListener("keydown", primeAudio, {capture:true});

  if (b.getAttribute("role") === "switch") sfx(b.getAttribute("aria-checked") === "true" ? "down" : "up");

}, true);

  return h("div", {class:"card", id:"dailyBoard", style:"margin-top:14px"},
    h("div", {class:"head"}, h("span", {class:"emo", style:"font-size:22px"}, "🏆"), h("h3", {}, "Today's leaderboard"), h("span", {class:"r muted"}, new Date().toLocaleDateString())),
    rows.length ? h("ol", {class:"board"}, rows.map(([id, sc], i) => h("li", {class: id === (curKidId() || "_") ? "me" : ""}, h("span", {}, ["🥇","🥈","🥉"][i] || `${i + 1}.`), h("b", {}, label(id)), h("span", {class:"r"}, Math.round(sc).toLocaleString()))))
      : h("p", {class:"help", style:"margin:0"}, "No scores yet today. Everyone gets the same targets, so it's a fair fight. New challenge every day!"));
}

/* ================================================================ 10.0: STREAMING OVERLAY, AUTO-TUNE */
function overlaySection(){
  const ov = CFG.overlay = isObj(CFG.overlay) ? CFG.overlay : {};
  const url = ov.key ? `http://127.0.0.1:${location.port}/overlay?key=${ov.key}${ov.style && ov.style !== "both" ? "&show=" + ov.style : ""}` : "";
  return [h("div", {class:"section-title"}, "📺 Streaming overlay"),
    h("p", {class:"section-sub"}, "Show your controller presses and profile on stream. Add it to OBS or Streamlabs as a Browser Source (width 600, height 260)."),
    h("div", {class:"form"},
      h("div", {class:"lab"}, "Overlay"),
      swtch(!!ov.enabled, on => { ov.enabled = on; if (on && !ov.key) ov.key = [...crypto.getRandomValues(new Uint8Array(9))].map(b => b.toString(16).padStart(2, "0")).join(""); changed(); renderAll(); }, "Streaming overlay"),
      ov.enabled ? h("div", {class:"lab"}, "Shows") : null,
      ov.enabled ? sel([["both","Controller and profile"],["pad","Just the controller"],["profile","Just the profile"]], ov.style || "both", v => { ov.style = v; changed(); renderAll(); }, {"aria-label":"Overlay shows"}) : null,
      ov.enabled && kids().length ? h("div", {class:"lab"}, "Show the player's name", h("div", {class:"help"}, "Off keeps names off the stream.")) : null,
      ov.enabled && kids().length ? swtch(!!ov.show_name, on => { ov.show_name = on; changed(); }, "Show player name on stream") : null,
      ov.enabled ? h("div", {class:"lab"}, "Browser Source URL", h("div", {class:"help"}, "Save first, then paste this into OBS. In OBS, tick “Refresh browser when scene becomes active”. Anyone with this link on your PC can see your button presses, nothing else.")) : null,
      ov.enabled ? h("div", {class:"cellrow"}, h("input", {type:"text", readonly:true, value:url, style:"flex:1;min-width:260px", onfocus: e => e.target.select()}),
        h("button", {class:"small", onclick: () => { navigator.clipboard && navigator.clipboard.writeText(url).then(() => toast("📋 Copied")); }}, "Copy"),
        h("button", {class:"small ghost", onclick: () => action("open_url", {url}).catch(() => window.open(url))}, "Preview")) : null)];
}
const TUNE_ALL = [{curve:1.0, label:"Straight"}, {curve:1.5, label:"Smooth"}, {curve:2.1, label:"Extra smooth"}];
let TUNE = TUNE_ALL;
function tuneSetCurve(live, curve){  // changes only this one setting and saves it right away
  const p = CFG.profiles[live]; if (!p) return;
  p.sticks = p.sticks || {}; p.sticks.right = p.sticks.right || {};
  if (curve == null) delete p.sticks.right.curve; else p.sticks.right.curve = curve;
  return save();
}
function aimTuneCancel(){
  const t = AIM.tune; if (!t) return;
  AIM.tune = null; clearTimeout(t.timer);
  tuneSetCurve(t.live, t.prev); toast("Tuning stopped. Your aim is back to how it was.");
}
async function aimTune(){
  const live = (STATE && STATE.profile && CFG.profiles[STATE.profile]) ? STATE.profile : curProfile;
  if (!(await confirmBox("Tune my aim", `Play 3 short Flick rounds. Each one uses a different aim curve on ${live}. Clutch keeps the one you score best with.`, "Let's go"))) return;
  const prev = getPath(CFG.profiles[live], ["sticks", "right", "curve"]);
  TUNE = [...TUNE_ALL].sort(() => Math.random() - .5);  // random order so warming up doesn't favor the last one
  AIM.tune = {live, prev, idx:0, scores:[]};
  AIM.mode = "flick"; aimTuneStep();
}
async function aimTuneStep(){
  const t = AIM.tune; if (!t || view !== "aim") return aimTuneCancel();
  await tuneSetCurve(t.live, TUNE[t.idx].curve); await new Promise(r => setTimeout(r, 500));
  if (AIM.tune !== t || view !== "aim") return;
  renderAll(); toast(`🎛️ Round ${t.idx + 1} of 3: ${TUNE[t.idx].label} aim`);
  t.timer = setTimeout(() => { if (AIM.tune === t && view === "aim") aimStart(); }, 300);
}
function aimTuneRound(score){
  const t = AIM.tune; if (!t) return false;
  t.scores.push(score); t.idx++;
  if (t.idx < TUNE.length){ t.timer = setTimeout(aimTuneStep, 1200); return true; }
  AIM.tune = null;
  const best = t.scores.indexOf(Math.max(...t.scores));
  tuneSetCurve(t.live, TUNE[best].curve);
  sfx("chime");
  $("#aimRes").replaceChildren(h("div", {class:"aimres"},
    h("div", {class:"aimhead"}, h("span", {class:"emo", style:"font-size:34px"}, "🎛️"), h("div", {}, h("b", {style:"font-size:22px"}, `${TUNE[best].label} aim wins!`),
      h("div", {class:"help"}, `${t.live} now uses it. You can change it any time on the Sticks tab.`))),
    h("div", {class:"astats"}, TUNE.map((v, i) => h("div", {class:"astat" + (i === best ? " win" : "")}, h("b", {}, Math.round(t.scores[i]).toLocaleString()), h("small", {}, v.label)))),
    h("div", {class:"cellrow"}, h("button", {class:"ghost small", onclick: () => { tuneSetCurve(t.live, t.prev); toast("Back to how it was"); }}, "Undo"))));
  return true;
}

/* ================================================================ boot */
async function boot(){
  $("#saveBtn").addEventListener("click", save);
  $("#undoBtn").addEventListener("click", () => { CFG = JSON.parse(SAVED); renderAll(); toast("Changes undone"); });
  $("#newProfile").addEventListener("click", addProfile);
  document.querySelectorAll(".side .nav[data-view]").forEach(b => b.addEventListener("click", () => { if (b.dataset.view === "setup") loadHealth().then(() => go("setup")); else go(b.dataset.view); }));
  $("#liveProfile").addEventListener("change", e => switchLive(e.target.value));
  $("#power").addEventListener("click", () => {
    const on = !(STATE && STATE.enabled !== false);
    api("/api/enabled", {on}).then(() => toast(on ? "⚡ Mods on" : "Mods off. Your controller works like normal.")).catch(e => toast(e.message));
    if (STATE){ STATE.enabled = on; renderHeader(); if (view === "home") renderAll(); }
  });
  window.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s"){ e.preventDefault(); save(); } });
  window.addEventListener("beforeunload", e => { if (dirty() && !autoApply()){ e.preventDefault(); e.returnValue = ""; } });
  window.addEventListener("resize", () => { drawStickViews(); drawTrigViews(); if (view === "aim" && !AIM.running) aimIdle(); });
  try {
    META = await api("/api/meta");
    $("#keyNames").replaceChildren(...META.keys.map(k => h("option", {value:k})));
    try { STATE = await api("/api/state"); } catch(e){}
    await loadHealth();
    if (!(await loadConfig())) return;
  } catch(e){
    showFatal(/old session/.test(e.message) ? "This page is from an earlier run of Clutch. Reload it." : "Can't reach Clutch. Start it, then reload this page.");
    $("#status").className = "pill off"; $("#statusText").textContent = "Not connected";
    return;
  }
  curProfile = (STATE && STATE.profile && CFG.profiles[STATE.profile]) ? STATE.profile : (CFG.start_profile && CFG.profiles[CFG.start_profile] ? CFG.start_profile : Object.keys(CFG.profiles)[0]);
  view = !CFG.welcome_done ? "welcome" : setupProblems() ? "setup" : "home";
  if (CFG.welcome_done && CFG.seen_version !== META.version) setTimeout(showWhatsNew, 600);
  else if (!CFG.welcome_done){ CFG.seen_version = META.version; }
  renderAll();
  if (STATE) onState(STATE);
  poll();
  setTimeout(() => { if (!GAMES) loadGames(); }, 400);
  loadStats();
  setTimeout(() => { if (kids().length && !curKidId() && view === "home" && !$("#dlg").open) whoIsPlaying(); }, 900);
}
boot();
</script>
