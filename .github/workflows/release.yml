# Builds the Windows installer on GitHub's own Windows machines.
# Change VERSION in clutch.py and push to main: if there's no release for that version yet, this builds
# Clutch-Setup-<version>.exe and publishes Release v<version>, which every installed Clutch offers as an update.
name: Build installer

on:
  push:
    branches: [main]
  workflow_dispatch:   # "Run workflow" button: builds a test installer without releasing it

permissions:
  contents: write

concurrency:              # a newer push cancels an older build that's still running
  group: build-installer
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      # vgamepad normally pops up the ViGEmBus driver installer while it installs; nobody can click it here
      # (the Clutch installer installs the driver on the user's PC instead)
      VGAMEPAD_SKIP_VIGEMBUS_INSTALL: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Is this a new version?
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-String -Path clutch.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          $new = ($LASTEXITCODE -ne 0)
          "release=$($new -and '${{ github.event_name }}' -eq 'push')" >> $env:GITHUB_OUTPUT
          "build=$($new -or '${{ github.event_name }}' -eq 'workflow_dispatch')" >> $env:GITHUB_OUTPUT
          if (-not $new) { Write-Host "Release v$v already exists; nothing to publish." }
          exit 0   # "gh release view" failing just means it's a new version

      - uses: actions/setup-python@v5
        if: steps.ver.outputs.build == 'True'
        with:
          python-version: "3.12"

      - name: Install Python packages
        if: steps.ver.outputs.build == 'True'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build Clutch.exe
        if: steps.ver.outputs.build == 'True'
        run: python -m PyInstaller --noconfirm --clean Clutch.spec

      - name: Install Inno Setup
        if: steps.ver.outputs.build == 'True'
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        if: steps.ver.outputs.build == 'True'
        shell: pwsh
        run: |
          $v = (python clutch.py --version).Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish the release
        if: steps.ver.outputs.release == 'True'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Clutch ${{ steps.ver.outputs.version }}
          files: installer_output/Clutch-Setup-*.exe
          generate_release_notes: true

      - name: Keep the test build
        if: steps.ver.outputs.build == 'True' && steps.ver.outputs.release != 'True'
        uses: actions/upload-artifact@v4
        with:
          name: Clutch-installer
          path: installer_output/Clutch-Setup-*.exe
